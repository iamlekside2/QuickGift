name: deploy-backend-aws

# Builds the backend container and pushes it to Amazon ECR on every change to
# backend-node/, then (optionally) triggers an App Runner deployment. App Runner
# can also auto-deploy when a new image lands in ECR — in that case the last
# step is a no-op and can stay disabled (leave APPRUNNER_SERVICE_ARN unset).
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID        access key for a deploy IAM user (ECR + App Runner)
#   AWS_SECRET_ACCESS_KEY    its secret
#   APPRUNNER_SERVICE_ARN    (optional) the App Runner service ARN to redeploy
# For stronger security you can swap the access keys for GitHub OIDC later
# (aws-actions/configure-aws-credentials with role-to-assume + id-token: write).

on:
  push:
    branches: [main]
    paths:
      - 'backend-node/**'
      - '.github/workflows/deploy-backend-aws.yml'
  workflow_dispatch: {}

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: quickgift-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend-node
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:${{ github.sha }}"

      - name: Trigger App Runner deployment
        if: env.APPRUNNER_SERVICE_ARN != ''
        run: aws apprunner start-deployment --service-arn "$APPRUNNER_SERVICE_ARN"
